<html lang="es">

<title>Lo que dice la ley</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap');

:root{
  --bg:#12141c;
  --panel:#1a1e2b;
  --panel2:#20263a;
  --yellow:#f4c430;
  --red:#e2402f;
  --blue3:#4a90d9;
  --purple3:#a374db;
  --ink:#f2f1ec;
  --sub:#98a0b8;
  --line:#33394d;

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Source Sans 3', -apple-system, sans-serif;
  min-height:100vh;

  align-items:center;
  justify-content:center;
  padding:20px;
}
.stage{
  width:100%;
  max-width:520px;
}

/* ---- hazard header stripe ---- */
.stripe{
  height:10px;
  width:100%;

  border-radius:6px 6px 0 0;
}

.card{

  border:1px solid var(--line);
  border-top:none;
  border-radius:0 0 14px 14px;
  display:flex;
  flex-direction:column;
}

.top{
  padding:22px 26px 0 26px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
}
.eyebrow{
  font-family:'Oswald',sans-serif;
  font-size:12px;
  letter-spacing:.14em;
  color:var(--yellow);
  font-weight:600;
}
.counter{
  font-size:12px;
  color:var(--sub);
  font-variant-numeric:tabular-nums;
}

.body{
  flex:1;
  padding:18px 26px 10px 26px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.icon-wrap{
  width:64px;height:64px;
  border-radius:12px;
  background:var(--panel2);
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);
  flex-shrink:0;
}
.icon-wrap svg{width:32px;height:32px;stroke:var(--yellow);fill:none;stroke-width:1.6;}

h1{
  font-family:'Oswald',sans-serif;
  font-size:24px;
  line-height:1.15;
  margin:0;
  font-weight:600;
  letter-spacing:.01em;
}
.qh1{
  font-size:17px;
  line-height:1.35;
  font-weight:500;
  text-align:justify;
}

.intro-body{
  justify-content:center;
}
.intro-p{
  font-size:16px;
  line-height:1.55;
  color:var(--ink);
  margin:0;
  text-align:justify;
}
.intro-objective{
  color:var(--yellow);
  font-weight:600;
}
.intro-duration{
  color:var(--sub);

  font-size:14px;
}
.intro-tag{

  font-family:'Oswald',sans-serif;
  font-size:11px;
  letter-spacing:.12em;
  color:var(--sub);

}

.block{

}
.block-law{
  background:linear-gradient(180deg, rgba(244,196,48,.08), rgba(244,196,48,.02));
  border-color:rgba(244,196,48,.35);
}
.block-ban{
  background:linear-gradient(180deg, rgba(226,64,47,.09), rgba(226,64,47,.02));
  border-color:rgba(226,64,47,.35);
}
.block-owncode{
  background:linear-gradient(180deg, rgba(74,144,217,.10), rgba(74,144,217,.02));
  border-color:rgba(74,144,217,.4);
}
.block-value{

.block-label{

  margin-bottom:6px;

  align-items:center;

.block-law .block-label{color:var(--yellow);}
.block-ban .block-label{color:var(--red);}
.block-owncode .block-label{color:var(--blue3);}
.block-value .block-label{color:var(--purple3);}

  line-height:1.5;
  color:var(--ink);
  text-align:justify;

.cite{

  margin-top:8px;
  font-size:12px;
  color:var(--sub);

}
.multi-quote{

}
.multi-quote:last-child{

}
.fine-note{

  line-height:1.5;

  margin:4px 0 0 0;

.caso-options{

  flex-direction:column;

}
.caso-option{

  line-height:1.4;
  padding:8px 10px;
  border-radius:8px;
  background:var(--panel2);
  border:1px solid var(--line);
  text-align:justify;
}
.caso-option.correct{
  background:rgba(120,190,110,.14);
  border-color:#78be6e;
}
.caso-cierre{
  text-align:center;
  font-family:'Oswald',sans-serif;
  font-size:15px;
  font-weight:600;
  letter-spacing:.02em;
  line-height:1.6;
  color:var(--yellow);
  margin:6px 0 0 0;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 22px 22px 22px;
  gap:10px;
  flex-shrink:0;
  position:sticky;
  bottom:0;
  background:var(--panel);
  border-top:1px solid var(--line);
  box-shadow:0 -8px 16px -8px rgba(0,0,0,.4);
}
button.navbtn{
  font-family:'Oswald',sans-serif;
  font-size:13px;
  letter-spacing:.06em;
  font-weight:600;
  background:var(--panel2);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:8px;
  padding:11px 18px;
  cursor:pointer;
  transition:background .15s ease, transform .1s ease;
}
button.navbtn:hover{background:#262d43;}
button.navbtn:active{transform:scale(.97);}
button.navbtn:disabled{opacity:.35;cursor:default;}
button.navbtn.primary{
  background:var(--yellow);
  color:#1a1400;
  border-color:var(--yellow);
}
button.navbtn.primary:hover{background:#ffd24d;}

.progressbar{
  height:4px;
  background:var(--line);
  border-radius:2px;
  overflow:hidden;
  margin:0 26px;
  flex-shrink:0;
}
.progressbar-fill{
  height:100%;
  background:var(--yellow);
  transition:width .25s ease;
}

/* ---- quiz ---- */
.qopt{
  display:block;
  width:100%;
  text-align:left;
  background:var(--panel2);
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:9px;
  padding:12px 14px;
  font-size:14px;
  margin-bottom:9px;
  cursor:pointer;

.qopt:hover{border-color:var(--yellow);}
.qopt.correct{background:rgba(120,190,110,.16); border-color:#78be6e; color:#cdeec6;}
.qopt.wrong{background:rgba(226,64,47,.16); border-color:var(--red); color:#ffcfc7;}
.qopt:disabled{cursor:default;}
.qfeedback{
  font-size:13px;
  color:var(--sub);
  min-height:18px;
  margin-top:2px;

.results{
  text-align:center;
  padding:30px 10px;
  display:flex;
  flex-direction:column;
  gap:14px;
  align-items:center;
  justify-content:center;
  flex:1;
}
.score{

  font-size:56px;
  font-weight:700;
  color:var(--yellow);

.verdict{
  font-size:15px;
  color:var(--ink);
  max-width:340px;
  line-height:1.5;
}
.small{
  font-size:12px;
  color:var(--sub);
  max-width:340px;
  line-height:1.5;
}
</style>
</head>

  if (idx < slides.length){
    renderSlide(slides[idx]);
  } else if (idx < slides.length + quiz.length){
    renderQuiz(quiz[idx - slides.length]);
  } else {
    renderResults();
  }
}

function renderSlide(s){
  if (s.kind === 'intro'){
    card.innerHTML = `
      <div class="top">
        <span class="eyebrow">BIENVENIDA</span>
        <span class="counter">${idx+1} / ${slides.length}</span>
      </div>
      <div class="progressbar"><div class="progressbar-fill" style="width:${progressPct()}%"></div></div>
      <div class="body intro-body">
        <h1>${s.title}</h1>
        <p class="intro-p">${s.welcome}</p>
        <p class="intro-p intro-objective">${s.objective}</p>
        ${s.duration ? `<p class="intro-p">${s.duration}</p>` : ''}
        ${s.disclaimer ? `<p class="fine-note">${s.disclaimer}</p>` : ''}
        ${s.tag ? `<p class="intro-tag">${s.tag}</p>` : ''}
      </div>
      <div class="nav">
        <button class="navbtn" id="prevBtn" disabled>← Atrás</button>
        <button class="navbtn primary" id="nextBtn">Empezar →</button>
      </div>
    `;
    document.getElementById('nextBtn').onclick = ()=>{ idx++; render(); };
    return;
  }
  if (s.kind === 'caso'){
    card.innerHTML = `
      <div class="top">
        <span class="eyebrow" style="color:var(--red)">${s.dateLabel}</span>
        <span class="counter">${idx+1} / ${slides.length}</span>
      </div>
      <div class="progressbar"><div class="progressbar-fill" style="width:${progressPct()}%"></div></div>
      <div class="body">
        <h1>${s.title}</h1>
        <div class="block block-owncode">
          <div class="block-label">SITUACIÓN</div>
          ${s.situacion.map(p=>`<p class="multi-quote">${p}</p>`).join('')}
          ${s.fuente ? `<span class="cite">${s.fuente}</span>` : ''}
        </div>
        ${s.porque_titulo ? `<div class="block block-ban">
          <div class="block-label">${s.porque_titulo}</div>
          <p>${s.porque_texto}${s.fuente ? `<span class="cite">${s.fuente}</span>` : ''}</p>
        </div>` : ''}
        <div class="block block-law">
          <div class="block-label">PREGUNTA DE COMPLIANCE</div>
          <p style="margin-bottom:10px;">${s.pregunta}</p>
          <div class="caso-options">
            ${s.opciones.map(o=>`<div class="caso-option${o.letra===s.correcta?' correct':''}">${o.letra===s.correcta?'✅':'◻️'} <b>${o.letra})</b> ${o.texto}</div>`).join('')}
          </div>
        </div>
        <div class="block block-owncode">
          <div class="block-label">POR QUÉ ES LA RESPUESTA CORRECTA</div>
          ${s.fundamentos.map(f=>`<p class="multi-quote">${f.quote}<span class="cite">${f.cite}</span></p>`).join('')}
        </div>
        <p class="caso-cierre">${s.cierre.join('<br>')}</p>
      </div>
      <div class="nav">
        <button class="navbtn" id="prevBtn" ${idx===0?'disabled':''}>← Atrás</button>
        <button class="navbtn primary" id="nextBtn">${idx===slides.length-1?'Ir al test →':'Siguiente →'}</button>
      </div>
    `;
    document.getElementById('prevBtn').onclick = ()=>{ idx--; render(); };
    document.getElementById('nextBtn').onclick = ()=>{ idx++; render(); };
    return;
  }
  const isCode = s.kind === 'code';
  const isValue = s.kind === 'value';
  let eyebrow, eyebrowColor, labelLaw, labelBan;
  if (isCode){
    eyebrow = 'LO QUE DICE EL CÓDIGO DE CONDUCTA DE AIRBUS';
    eyebrowColor = 'var(--blue3)';
    labelLaw = 'EL CÓDIGO DE CONDUCTA DICE';
    labelBan = s.banLabel || 'NO SE DEBE HACER';
  } else if (isValue){
    eyebrow = 'LO QUE DICEN LOS VALORES DE AIRBUS';
    eyebrowColor = 'var(--purple3)';
    labelLaw = 'EL VALOR DICE';
    labelBan = 'A PRUEBA';
  } else {
    eyebrow = 'LO QUE DICE LA LEY';
    eyebrowColor = 'var(--yellow)';
    labelLaw = 'LA LEY DICE';
    labelBan = 'NO SE PUEDE HACER';
  }
  const blockClass = isCode ? 'block-owncode' : (isValue ? 'block-value' : 'block-law');
  const lawTopBlock = s.lawItems
    ? `<div class="block ${blockClass}">
        <div class="block-label">${labelLaw}</div>
        ${s.lawItems.map(it => `<p class="multi-quote">${it.quote}<span class="cite">${it.cite}</span></p>`).join('')}
      </div>`
    : (s.jurisItems || !s.law ? '' : `<div class="block ${blockClass}">
        <div class="block-label">${labelLaw}</div>
        <p>${s.law}${s.lawCite ? `<span class="cite">${s.lawCite}</span>` : ''}</p>
      </div>`);
  const jurisBlock = s.jurisItems ? `<div class="block ${blockClass}">
        <div class="block-label">LA JURISPRUDENCIA DICE</div>
        ${s.jurisItems.map(it => `<p class="multi-quote">${it.quote}<span class="cite">${it.cite}</span></p>`).join('')}
      </div>` : '';
  const lawBlockHTML = lawTopBlock + jurisBlock;
  card.innerHTML = `
    <div class="top">
      <span class="eyebrow" style="color:${eyebrowColor}">${eyebrow}</span>
      <span class="counter">${idx+1} / ${slides.length}</span>
    </div>
    <div class="progressbar"><div class="progressbar-fill" style="width:${progressPct()}%"></div></div>
    <div class="body">
      <h1>${s.title}</h1>
      ${lawBlockHTML}
      ${(s.ban || s.banItems) ? `<div class="block block-ban">
        <div class="block-label">${labelBan}</div>
        ${s.banItems ? s.banItems.map(p=>`<p class="multi-quote">${p}</p>`).join('') : `<p>${s.ban}</p>`}
      </div>` : ''}
      ${s.note ? `<p class="fine-note">${s.note}</p>` : ''}

    </div>
    <div class="nav">
      <button class="navbtn" id="prevBtn" ${idx===0?'disabled':''}>← Atrás</button>
      <button class="navbtn primary" id="nextBtn">${idx===slides.length-1?'Ir al test →':'Siguiente →'}</button>
    </div>
  `;
  document.getElementById('prevBtn').onclick = ()=>{ idx--; render(); };
  document.getElementById('nextBtn').onclick = ()=>{ idx++; render(); };
}

function renderQuiz(item){
  answered = false;
  const n = idx - slides.length;
  card.innerHTML = `
    <div class="top">
      <span class="eyebrow" style="color:var(--red)">TEST FINAL</span>
      <span class="counter">Pregunta ${n+1} / ${quiz.length}</span>
    </div>
    <div class="progressbar"><div class="progressbar-fill" style="width:${progressPct()}%"></div></div>
    <div class="body">
      <h1 class="qh1">${item.q}</h1>
      <div id="opts">
        ${item.options.map((o,i)=>`<button class="qopt" data-i="${i}">${o}</button>`).join('')}
      </div>
      <div class="qfeedback" id="feedback"></div>
    </div>
    <div class="nav">
      <button class="navbtn" id="prevBtn">← Atrás</button>
      <button class="navbtn primary" id="nextBtn" disabled>${n===quiz.length-1?'Ver resultado →':'Siguiente →'}</button>
    </div>
  `;
  document.getElementById('prevBtn').onclick = ()=>{ idx--; render(); };
  document.getElementById('nextBtn').onclick = ()=>{ idx++; render(); };

  document.querySelectorAll('.qopt').forEach(btn=>{
    btn.onclick = ()=>{
      if (answered) return;
      answered = true;
      const chosen = parseInt(btn.getAttribute('data-i'));
      document.querySelectorAll('.qopt').forEach((b,i)=>{
        b.disabled = true;
        if (i === item.correct) b.classList.add('correct');
        else if (i === chosen) b.classList.add('wrong');
      });
      const fb = document.getElementById('feedback');
      let msg;
      if (chosen === item.correct){
        score++;
        msg = "Correcto.";
      } else {
        msg = "No es correcto — se ha marcado la respuesta correcta.";
      }
      if (item.feedback) msg += '<br><br>' + item.feedback.replace(/\n/g,'<br>');
      fb.innerHTML = msg;
      document.getElementById('nextBtn').disabled = false;
    };
  });
}

function renderResults(){
  const pct = (score/quiz.length)*100;
  let verdict;
  if (pct >= 100){
    verdict = "\u00abEnhorabuena. Ya puedes explicarle el derecho de huelga al departamento jurídico.\u00bb";
  } else if (pct >= 80){
    verdict = "\u00abExcelente. RRHH quiere hablar contigo. Tranquilo, solo es una reunión informativa.\u00bb";
  } else if (pct >= 60){
    verdict = "\u00abAprobado. Ya sabes suficiente para que no te inviten a la próxima mesa de negociación.\u00bb";
  } else if (pct >= 40){
    verdict = "\u00abNecesitas repasar. Aún tienes posibilidades de llegar a directivo.\u00bb";
  } else if (pct >= 20){
    verdict = "\u00abBuen perfil para RRHH. Recuerda: si una mesa no funciona, siempre puedes abrir otra.\u00bb";
  } else {
    verdict = "\u00ab\u00a1Enhorabuena! Tu candidatura para CEO ha sido preseleccionada.\u00bb";
  }
  card.innerHTML = `
    <div class="top">
      <span class="eyebrow">RESULTADO</span>
      <span class="counter"></span>
    </div>
    <div class="progressbar"><div class="progressbar-fill" style="width:100%"></div></div>
    <div class="results">
      <div class="score">${score}/${quiz.length}</div>
      <div class="verdict">${verdict}</div>
      <p class="fine-note">Este curso constituye una obra satírica y de propaganda vinculada al conflicto laboral y al ejercicio del derecho de huelga. No constituye formación oficial de Airbus ni asesoramiento jurídico. Distingue entre hechos, opiniones y valoraciones jurídicas. Las referencias a posibles vulneraciones legales expresan valoraciones o riesgos jurídicos y no implican que exista una infracción declarada judicialmente. Los casos identificados como hipotéticos o satíricos no constituyen afirmaciones de hechos respecto de personas u organizaciones concretas.</p>
    </div>
    <div class="nav">
      <button class="navbtn" id="restartBtn">↺ Repetir curso</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = ()=>{ idx=0; score=0; render(); };
}

function progressPct(){
  return Math.round(((idx+1)/TOTAL_STEPS)*100);
}

render();
</script>

</body>
</html>
